<main class="main-panel">
<header class="page-header"><div><h1>AI Assistant</h1><p>Meal ideas tailored to your goals and preferences.</p></div></header>
<section class="chat-panel" aria-label="Calorie AI chat">
  <header class="chat-header"><span class="ai-avatar" aria-hidden="true">✦</span><div><h2>Calorie AI</h2><p><span class="status-dot" aria-hidden="true"></span>Nutrition assistant</p></div></header>
  <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation"></div>
  <div id="chat-error" class="notice" role="alert" hidden><span id="error-text"></span><button type="button" id="retry-button">Try again</button></div>
  <div class="chat-controls">
    <div class="suggestions" aria-label="Suggested questions"><button type="button" data-prompt="What should I eat for dinner?">Dinner ideas</button><button type="button" data-prompt="Suggest some high-protein meals.">High-protein meals</button><button type="button" data-prompt="Explain protein, carbs and fat.">Explain my macros</button></div>
    <div id="photo-preview" class="photo-preview" hidden>
      <img id="preview-image" alt="Selected meal photo">
      <div><strong id="photo-name"></strong><small>Image ready to send</small></div>
      <button type="button" id="remove-photo" aria-label="Remove selected photo">×</button>
    </div>
    <form id="chat-form" class="composer">
      <label class="sr-only" for="message-input">Your message</label>
      <textarea id="message-input" rows="1" maxlength="2000" placeholder="Ask Calorie AI anything about your meals…" dir="auto"></textarea>
      <div class="composer-toolbar">
        <div class="attachment-actions">
          <label class="attachment-action" for="photo-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg><span>Upload Image</span>
            <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" aria-label="Upload Image">
          </label>
          <label class="attachment-action" for="camera-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h3l2-3h6l2 3h3a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="4"/></svg><span>Take Photo</span>
            <input id="camera-input" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" aria-label="Take Photo">
          </label>
          <button id="voice-input" class="attachment-action" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg><span id="voice-label">Voice Input</span></button>
        </div>
        <button class="send-button" id="send-button" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"/></svg><span>Send</span></button>
      </div>
    </form>
    <p class="chat-note" id="chat-note">Demo responses use example data. Enter sends • Shift + Enter adds a new line.</p>
  </div>
</section>
</main></div><noscript><p class="notice">Enable JavaScript to use the chat.</p></noscript></body></html>
