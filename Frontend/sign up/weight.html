<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#168454">
  <title>Your weight | Calorie</title>
  <link rel="stylesheet" href="signup.css">
  <script src="signup.js" defer></script>
</head>
<body data-step="2">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-male" viewBox="0 0 48 48"><circle cx="24" cy="12" r="8"/><path d="M8 43c0-13 7-20 16-20s16 7 16 20Z"/></symbol>
<symbol id="i-female" viewBox="0 0 48 48"><path d="M11 28V16a13 13 0 0 1 26 0v12M15 12c6 3 12 3 18 0v4a9 9 0 0 1-18 0ZM8 43c0-12 7-18 16-18s16 6 16 18Z"/></symbol>
<symbol id="i-sofa" viewBox="0 0 48 48"><path d="M10 24V12c0-4 3-6 6-6h16c3 0 6 2 6 6v12M8 19c-3 0-5 2-5 5v13h42V24c0-3-2-5-5-5s-5 2-5 5v5H13v-5c0-3-2-5-5-5ZM9 37v6M39 37v6"/></symbol>
<symbol id="i-walk" viewBox="0 0 48 48"><circle cx="28" cy="6" r="4"/><path d="m23 14-8 11-7 1m15-12 5 11 10 5m-15-16-3 18-7 12m7-12 11 3 4 9"/></symbol>
<symbol id="i-run" viewBox="0 0 48 48"><circle cx="31" cy="7" r="4"/><path d="m15 21 9-9 8 10 9 2M24 12l-6 18 12 5-3 10M18 30 9 40H2"/></symbol>
<symbol id="i-dumbbell" viewBox="0 0 48 48"><path d="M15 24h18M8 14h7v20H8ZM33 14h7v20h-7ZM3 19h5v10H3ZM40 19h5v10h-5Z"/></symbol>
<symbol id="i-mountain" viewBox="0 0 48 48"><path d="m2 42 18-34 11 18 5-8 10 24ZM13 22l7 5 5-5"/></symbol>
<symbol id="i-flame" viewBox="0 0 48 48"><path d="M26 3c4 12-6 14-2 23 4-2 6-7 6-10 10 9 14 15 10 24-5 10-25 9-30-1-5-11 3-18 8-24 0 6 2 8 4 8 4-6 7-11 4-20Z"/></symbol>
<symbol id="i-muscle" viewBox="0 0 48 48"><path d="M7 41c-4-10-2-26 6-35l9-2 6 5-4 7-6-3-5 11c11-8 26-8 28 3 3 14-15 20-34 14Z"/></symbol>
<symbol id="i-target" viewBox="0 0 48 48"><circle cx="23" cy="25" r="19"/><circle cx="23" cy="25" r="11"/><circle cx="23" cy="25" r="3"/><path d="m23 25 20-20M34 4v10h10"/></symbol>
<symbol id="i-food" viewBox="0 0 48 48"><path d="M8 4v14c0 6 12 6 12 0V4M14 4v40M33 4c-6 6-7 15-7 23h9V4ZM35 27v17"/></symbol>
<symbol id="i-leaf" viewBox="0 0 48 48"><path d="M42 5C12 3 3 14 7 30c4 18 35 14 35-25ZM5 43 32 17"/></symbol>
<symbol id="i-sprout" viewBox="0 0 48 48"><path d="M24 44V23M24 26C10 27 4 17 5 8c13 0 21 7 19 18ZM24 24C24 10 33 4 44 5c-1 12-8 21-20 19Z"/></symbol>
</defs></svg>
  <main class="setup-page">
    <p class="page-label">Account Setup</p>
    <section class="setup-card" aria-labelledby="step-title">
      <svg class="decoration decoration-top" viewBox="0 0 290 360" aria-hidden="true">
        <path class="leaf-soft" d="M12 5C95 22 189 92 182 222C86 163 16 138 12 5Z"/>
        <path class="leaf-soft" d="M13 158C66 181 126 238 128 300C51 261 19 222 13 158Z"/>
        <path class="leaf-vein" d="M13 9L132 164M15 162L99 258"/>
        <path class="leaf-faint" d="M89 0H290C218 65 147 71 89 0Z"/>
      </svg>
      <svg class="decoration decoration-bottom" viewBox="0 0 310 350" aria-hidden="true">
        <path class="leaf-soft" d="M280 8C180 95 149 190 222 253C295 179 315 91 280 8Z"/>
        <path class="leaf-soft" d="M67 265C159 216 212 246 243 318C164 324 120 295 67 265Z"/>
        <path class="leaf-faint" d="M0 350C80 268 142 307 200 350Z"/>
        <path class="leaf-stem" d="M283 47C251 145 193 273 263 350M116 266C174 277 219 303 263 350"/>
      </svg>

      
      <div class="setup-content">
        <div class="brand" aria-label="Calorie">
          <svg class="brand-mark" viewBox="0 0 154 112" aria-hidden="true">
            <defs>
              <linearGradient id="green-leaf" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#128451"/>
                <stop offset="1" stop-color="#006b43"/>
              </linearGradient>
              <linearGradient id="light-leaf" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#99ca8c"/>
                <stop offset="1" stop-color="#76b779"/>
              </linearGradient>
            </defs>
            <path fill="url(#light-leaf)" d="M8 15C48 26 76 49 64 98C22 88 4 62 8 15Z"/>
            <path fill="url(#green-leaf)" d="M148 3C109 13 74 34 79 97L123 37L84 109C137 96 154 55 148 3Z"/>
          </svg>
          <span class="brand-name">Calorie</span>
        </div>
        <p class="step-label">Step 2 of 8</p>
        <progress class="step-progress" value="2" max="8" aria-label="Setup progress">2 of 8</progress>
        <h1 id="step-title" tabindex="-1">Your weight</h1>
        <p class="subtitle">Select your current weight.</p>
        <p class="preview-note" id="preview-note" hidden>Preview mode · No account will be created.</p>
        <form id="step-form" novalidate>
          <fieldset class="units"><legend class="sr-only">Weight unit</legend><label><input type="radio" name="weightUnit" value="kg" checked><span>kg</span></label><label><input type="radio" name="weightUnit" value="lb"><span>lb</span></label></fieldset><div class="picker-block"><span class="picker-label" id="weight-label">Weight</span><button type="button" class="picker-arrow" data-picker-change="weight" data-direction="-1" aria-label="Decrease Weight">⌃</button><div class="number-picker" id="picker-weight" data-picker="weight" tabindex="0" role="spinbutton" aria-labelledby="weight-label" aria-describedby="picker-help"><div class="picker-rows" aria-hidden="true"></div></div><button type="button" class="picker-arrow" data-picker-change="weight" data-direction="1" aria-label="Increase Weight">⌄</button></div><p id="picker-help" class="picker-help">Scroll, swipe, tap a number, or use the arrow keys.</p>
          <p id="form-error" class="error-banner" role="alert" hidden></p>
          <nav class="step-actions" aria-label="Step navigation">
            <a class="back-link" href="signup.html">Back</a>
            <button class="next-button" id="next-button" type="submit">Next</button>
          </nav>
          
        </form>
        <section id="completion" hidden aria-labelledby="completion-title">
          <div class="success-mark" aria-hidden="true">✓</div>
          <h2 id="completion-title" tabindex="-1">Your preferences are ready!</h2>
          <p id="completion-message" class="subtitle"></p>
          <dl id="summary" class="summary"></dl>
          <div class="completion-actions"><button type="button" id="edit-preferences" class="text-link">Edit preferences</button><a href="index.html" class="next-button">Back to Welcome</a></div>
        </section>
      </div>
    </section>
    <noscript><p class="no-script">Enable JavaScript to use the setup pages.</p></noscript>
  </main>
</body>
</html>
