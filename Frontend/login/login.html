<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#168454">
  <meta name="description" content="Log in to your Calorie account using your email address.">
  <title>Login | Calorie</title>
  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>
<body>
  <main class="setup-page login-page">
    <p class="page-label" id="page-label">Login</p>
    <section class="setup-card" aria-labelledby="login-title">
      <svg class="decoration decoration-top" viewBox="0 0 290 360" aria-hidden="true">
        <path class="leaf-soft" d="M12 5C95 22 189 92 182 222C86 163 16 138 12 5Z"/>
        <path class="leaf-soft" d="M13 158C66 181 126 238 128 300C51 261 19 222 13 158Z"/>
        <path class="leaf-vein" d="M13 9L132 164M15 162L99 258"/>
        <path class="leaf-faint" d="M89 0H290C218 65 147 71 89 0Z"/>
      </svg>
      <svg class="decoration decoration-bottom" viewBox="0 0 310 350" aria-hidden="true">
        <path class="leaf-soft" d="M280 8C180 95 149 190 222 253C295 179 315 91 280 8Z"/>
        <path class="leaf-soft" d="M67 265C159 216 212 246 243 318C164 324 120 295 67 265Z"/>
        <path class="leaf-faint" d="M0 350C80 268 142 307 200 350Z"/>
        <path class="leaf-stem" d="M283 47C251 145 193 273 263 350M116 266C174 277 219 303 263 350"/>
      </svg>

      
      <div class="setup-content login-content">
        <div class="brand" aria-label="Calorie">
          <svg class="brand-mark" viewBox="0 0 154 112" aria-hidden="true">
            <defs>
              <linearGradient id="green-leaf" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#128451"/>
                <stop offset="1" stop-color="#006b43"/>
              </linearGradient>
              <linearGradient id="light-leaf" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#99ca8c"/>
                <stop offset="1" stop-color="#76b779"/>
              </linearGradient>
            </defs>
            <path fill="url(#light-leaf)" d="M8 15C48 26 76 49 64 98C22 88 4 62 8 15Z"/>
            <path fill="url(#green-leaf)" d="M148 3C109 13 74 34 79 97L123 37L84 109C137 96 154 55 148 3Z"/>
          </svg>
          <span class="brand-name">Calorie</span>
        </div>
        <h1 id="login-title" tabindex="-1">Welcome back!</h1>
        <p class="subtitle" id="login-subtitle">Log in to continue your nutrition journey.</p>
        <p class="preview-note" id="preview-note" hidden>Preview mode · Connect your backend to enable login and password reset.</p>

        <!-- Login accepts Email only, not a username. -->
        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Enter your email address" autocomplete="username" inputmode="email" maxlength="254" required aria-describedby="email-error">
            <p class="field-error" id="email-error"></p>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required aria-describedby="password-error">
              <button type="button" class="eye-button" id="toggle-password" aria-label="Show password" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <p class="field-error" id="password-error"></p>
          </div>
          <div class="forgot-row"><button type="button" class="text-link" id="forgot-password">Forgot Your Password?</button></div>
          <p id="login-error" class="error-banner" role="alert" hidden></p>
          <p id="login-status" class="status-banner" role="status" aria-live="polite" hidden></p>
          <button class="next-button login-button" id="login-button" type="submit">Login</button>
          <p class="login-line">Don’t have an account? <a class="text-link" href="signup.html">Sign Up</a></p>
        </form>

        <!-- Password reset view, in the same card and design. -->
        <form id="reset-form" novalidate hidden>
          <div class="form-field">
            <label for="reset-email">Email</label>
            <input id="reset-email" name="email" type="email" placeholder="Enter your email address" autocomplete="email" inputmode="email" maxlength="254" required aria-describedby="reset-email-error">
            <p class="field-error" id="reset-email-error"></p>
          </div>
          <p id="reset-error" class="error-banner" role="alert" hidden></p>
          <p id="reset-status" class="status-banner" role="status" aria-live="polite" hidden></p>
          <button class="next-button login-button" id="reset-button" type="submit">Send Reset Link</button>
          <p class="login-line"><button class="text-link" id="back-to-login" type="button">Back to Login</button></p>
        </form>

        <a href="index.html" class="welcome-link">Back to Welcome</a>
      </div>
    </section>
    <noscript><p class="no-script">Enable JavaScript to use login and password reset.</p></noscript>
  </main>
</body>
</html>
