<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#168454">
  <meta name="description" content="Calorie helps you track nutrition, discover personalized meal ideas, and reach your goals together.">
  <title>Welcome to Calorie</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="welcome-page">
    <p class="page-label">Welcome</p>

    <section class="welcome-card" aria-labelledby="welcome-title">
      <!-- Decorative artwork: drawn locally; no image downloads needed. -->
      <svg class="decoration decoration-top" viewBox="0 0 290 360" aria-hidden="true">
        <path class="leaf-soft" d="M12 5C95 22 189 92 182 222C86 163 16 138 12 5Z"/>
        <path class="leaf-soft" d="M13 158C66 181 126 238 128 300C51 261 19 222 13 158Z"/>
        <path class="leaf-vein" d="M13 9L132 164M15 162L99 258"/>
        <path class="leaf-faint" d="M89 0H290C218 65 147 71 89 0Z"/>
      </svg>
      <svg class="decoration decoration-bottom" viewBox="0 0 310 350" aria-hidden="true">
        <path class="leaf-soft" d="M280 8C180 95 149 190 222 253C295 179 315 91 280 8Z"/>
        <path class="leaf-soft" d="M67 265C159 216 212 246 243 318C164 324 120 295 67 265Z"/>
        <path class="leaf-faint" d="M0 350C80 268 142 307 200 350Z"/>
        <path class="leaf-stem" d="M283 47C251 145 193 273 263 350M116 266C174 277 219 303 263 350"/>
      </svg>

      <div class="welcome-content">
        <!-- Calorie leaf mark. -->
        <div class="brand" aria-label="Calorie">
          <svg class="brand-mark" viewBox="0 0 154 112" aria-hidden="true">
            <defs>
              <linearGradient id="green-leaf" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#128451"/>
                <stop offset="1" stop-color="#006b43"/>
              </linearGradient>
              <linearGradient id="light-leaf" x1="0" y1="0" x2="1" y2="1">
                <stop stop-color="#99ca8c"/>
                <stop offset="1" stop-color="#76b779"/>
              </linearGradient>
            </defs>
            <path fill="url(#light-leaf)" d="M8 15C48 26 76 49 64 98C22 88 4 62 8 15Z"/>
            <path fill="url(#green-leaf)" d="M148 3C109 13 74 34 79 97L123 37L84 109C137 96 154 55 148 3Z"/>
          </svg>
          <span class="brand-name">Calorie</span>
        </div>

        <h1 id="welcome-title">Nutrition made personal.</h1>
        <p class="intro">Track your meals, get personalized suggestions,<br class="desktop-break"> and reach your goals together.</p>

        <!-- Three core benefits. -->
        <ul class="features" aria-label="Calorie features">
          <li class="feature">
            <span class="feature-icon">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M7 29h8v15H7zM21 19h8v25h-8zM35 6h8v38h-8z"/>
              </svg>
            </span>
            <span>Track Nutrition</span>
          </li>
          <li class="feature">
            <span class="feature-icon">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <path d="M16 29c-3-3-5-6-5-10a13 13 0 0 1 26 0c0 4-2 7-5 10-2 2-3 4-3 7H19c0-3-1-5-3-7ZM19 40h10M21 44h6M24 1V-3M6 5 3 2M42 5l3-3M4 19H0M44 19h4"/>
              </svg>
            </span>
            <span>AI Meal Ideas</span>
          </li>
          <li class="feature">
            <span class="feature-icon">
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="12" r="8"/>
                <path d="M14 7a7 7 0 1 0 0 13M34 7a7 7 0 1 1 0 13M10 42v-6a14 14 0 0 1 28 0v6ZM10 37H2v-6c0-6 5-10 11-10M38 37h8v-6c0-6-5-10-11-10"/>
              </svg>
            </span>
            <span>Grow Together</span>
          </li>
        </ul>

        <!-- Connect these buttons to your authentication pages in script.js. -->
        <div class="actions">
          <button class="button button-primary" type="button" data-action="login">Login</button>
          <button class="button button-outline" type="button" data-action="signup">Sign Up</button>
        </div>
        <p class="footer-text">Your journey starts here.</p>
        <p id="action-message" class="action-message" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
</body>
</html>
